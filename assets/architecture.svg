<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><rect width="1400" height="760" fill="#FFFFFF"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94A3B8"/></marker></defs><text x="40" y="56" font-family="DejaVu Sans" font-size="28" font-weight="bold" fill="#0F172A">Jev decides the route. Only LLM replies pass through the guard.</text><rect x="40" y="100" width="300" height="90" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="190.0" y="141.0" text-anchor="middle" font-family="DejaVu Sans" font-size="21" font-weight="bold" fill="#0F172A">Customer message</text><text x="190.0" y="167.0" text-anchor="middle" font-family="DejaVu Sans" font-size="16" fill="#475569">free text</text><rect x="420" y="100" width="380" height="90" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/><text x="610.0" y="141.0" text-anchor="middle" font-family="DejaVu Sans" font-size="21" font-weight="bold" fill="#0F172A">Jev call 1: classify</text><text x="610.0" y="167.0" text-anchor="middle" font-family="DejaVu Sans" font-size="16" fill="#475569">intent, complexity, wants_human</text><rect x="880" y="100" width="340" height="90" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="1050.0" y="141.0" text-anchor="middle" font-family="DejaVu Sans" font-size="21" font-weight="bold" fill="#0F172A">decide()</text><text x="1050.0" y="167.0" text-anchor="middle" font-family="DejaVu Sans" font-size="16" fill="#475569">plain if statements in code</text><path d="M340 145H418" fill="none" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ar)"/><path d="M800 145H878" fill="none" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ar)"/><path d="M1050 190V230H70V686" fill="none" stroke="#94A3B8" stroke-width="2.2"/><rect x="110" y="262" width="500" height="80" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="132" y="298.0" text-anchor="start" font-family="DejaVu Sans" font-size="21" font-weight="bold" fill="#0F172A">Order lookup (tool, no LLM)</text><text x="132" y="324.0" text-anchor="start" font-family="DejaVu Sans" font-size="16" fill="#475569">intent = order_status</text><path d="M70 302H108" fill="none" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ar)"/><rect x="110" y="358" width="500" height="80" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="132" y="394.0" text-anchor="start" font-family="DejaVu Sans" font-size="21" font-weight="bold" fill="#0F172A">Small LLM: gpt-oss-20b</text><text x="132" y="420.0" text-anchor="start" font-family="DejaVu Sans" font-size="16" fill="#475569">intent = product_question</text><path d="M70 398H108" fill="none" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ar)"/><rect x="110" y="454" width="500" height="80" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="132" y="490.0" text-anchor="start" font-family="DejaVu Sans" font-size="21" font-weight="bold" fill="#0F172A">Big LLM: gpt-oss-120b</text><text x="132" y="516.0" text-anchor="start" font-family="DejaVu Sans" font-size="16" fill="#475569">return_exchange, or complaint at or below 1.0</text><path d="M70 494H108" fill="none" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ar)"/><rect x="110" y="550" width="500" height="80" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="132" y="586.0" text-anchor="start" font-family="DejaVu Sans" font-size="21" font-weight="bold" fill="#0F172A">Human handoff</text><text x="132" y="612.0" text-anchor="start" font-family="DejaVu Sans" font-size="16" fill="#475569">wants_human above 0.7, or complaint above 1.0</text><path d="M70 590H108" fill="none" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ar)"/><rect x="110" y="646" width="500" height="80" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/><text x="132" y="682.0" text-anchor="start" font-family="DejaVu Sans" font-size="21" font-weight="bold" fill="#0F172A">Ask to clarify</text><text x="132" y="708.0" text-anchor="start" font-family="DejaVu Sans" font-size="16" fill="#475569">confidence below 0.5, or intent = other</text><path d="M70 686H108" fill="none" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ar)"/><rect x="740" y="390" width="460" height="110" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/><text x="970.0" y="441.0" text-anchor="middle" font-family="DejaVu Sans" font-size="21" font-weight="bold" fill="#0F172A">Jev call 2: guard</text><text x="970.0" y="467.0" text-anchor="middle" font-family="DejaVu Sans" font-size="16" fill="#475569">over_promises, invents_facts, answers_customer</text><path d="M610 398H680V430H738" fill="none" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ar)"/><path d="M610 494H680V462H738" fill="none" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ar)"/><rect x="760" y="590" width="170" height="70" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="2.5"/><text x="845.0" y="632.0" text-anchor="middle" font-family="DejaVu Sans" font-size="21" font-weight="bold" fill="#0F172A">Send reply</text><rect x="960" y="590" width="200" height="70" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/><text x="1060.0" y="632.0" text-anchor="middle" font-family="DejaVu Sans" font-size="21" font-weight="bold" fill="#0F172A">Hold for review</text><path d="M845 500V588" fill="none" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ar)"/><path d="M1060 500V588" fill="none" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#ar)"/><text x="855" y="550" font-family="DejaVu Sans" font-size="16" fill="#475569">all checks pass</text><text x="1070" y="550" font-family="DejaVu Sans" font-size="16" fill="#475569">any check fires</text><text x="760" y="700" font-family="DejaVu Sans" font-size="16" fill="#475569">Tool, human and clarify replies are computed</text><text x="760" y="722" font-family="DejaVu Sans" font-size="16" fill="#475569">or canned, so they skip the guard.</text></svg>